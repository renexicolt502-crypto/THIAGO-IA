databases:
  - name: thiago-ia-db
    plan: free
    databaseName: thiago_ia
    user: thiago_ia

services:
  - type: web
    name: thiago-ia
    env: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4
      - key: ADMIN_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: thiago-ia-db
          property: connectionString
